<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keluar trek · Shah Redza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0e10">
<!-- Halaman ini boleh dipapar pada sebarang laluan, jadi semua link guna alamat penuh -->
<link rel="icon" href="https://shahredza.github.io/garaj/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;0,900;1,900&family=Titillium+Web:wght@400;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
  :root {
    --night: #0e0e10; --fg: #f3f1ec; --muted: #9a98a1; --line: #2c2c33; --red: #e10600; --hb: #ff2a1f; --gx: #00bfae; --t3: #ffb000;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Titillium Web", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --g: max(16px, env(safe-area-inset-left, 0px));
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100svh; background: var(--night); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 var(--g); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .mark { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mark b { background: var(--red); color: #fff; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 20px; letter-spacing: 0; padding: 2px 10px; transform: skewX(-12deg); }
  .lang { display: flex; border: 1.5px solid currentColor; }
  .lang button { background: transparent; color: inherit; border: 0; padding: 7px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .1em; opacity: .55; }
  .lang button[aria-pressed="true"] { background: var(--red); color: #fff; opacity: 1; }

  main { position: relative; overflow: hidden; display: grid; align-content: center; padding: 40px 0 70px; }
  .gravel { position: absolute; left: -5%; right: -5%; top: 56%; height: 30px; transform: skewY(-8deg); background: repeating-linear-gradient(90deg, var(--fg) 0 28px, transparent 28px 40px); opacity: .1; }
  .big { position: absolute; right: var(--g); top: 4%; font-family: var(--display); font-style: italic; font-weight: 900; font-size: clamp(160px, 30vw, 420px); line-height: .8; color: transparent; -webkit-text-stroke: 2px rgba(243, 241, 236, .14); pointer-events: none; }
  .flag { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--t3); }
  .flag i { width: 22px; height: 14px; background: var(--t3); }
  h1 { position: relative; margin: 18px 0 0; font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .85; font-size: clamp(72px, 13vw, 190px); text-wrap: balance; }
  h1 span { color: var(--red); }
  .lede { position: relative; max-width: 34em; margin: 26px 0 0; color: #c7c5cc; font-size: clamp(17px, 1.5vw, 20px); }
  .row { position: relative; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; transition: transform .2s, filter .2s; }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-line { border: 1.5px solid var(--line); }
  .btn-line:hover { border-color: var(--fg); }
  .btn-line i { width: 10px; height: 10px; transform: skewX(-12deg); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 22px 0 calc(22px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="mark" href="https://shahredza.github.io/garaj/"><b>SR</b>Shah Redza</a>
  <div class="lang" role="group" aria-label="Language / Bahasa"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ms" aria-pressed="true">BM</button></div>
</div></header>

<main>
  <span class="gravel" aria-hidden="true"></span>
  <span class="big" aria-hidden="true">404</span>
  <div class="wrap">
    <p class="flag"><i aria-hidden="true"></i><span data-en="Yellow flag · 404">Bendera kuning · 404</span></p>
    <h1><span data-en="Off">Keluar</span><br><span data-en="track!">trek!</span></h1>
    <p class="lede" data-en="This page isn't on the circuit. The link may be wrong, or the page has been moved to another pit lane.">Halaman ini tiada di litar. Mungkin link salah, atau halaman sudah dipindah ke lorong pit lain.</p>
    <div class="row">
      <a class="btn btn-red" href="https://shahredza.github.io/garaj/"><span data-en="Back to the grid">Kembali ke grid</span></a>
      <a class="btn btn-line" href="https://shahredza.github.io/garaj/healthybite.html"><i style="background:var(--hb)" aria-hidden="true"></i>HealthyBite</a>
      <a class="btn btn-line" href="https://shahredza.github.io/garaj/gainix.html"><i style="background:var(--gx)" aria-hidden="true"></i>Gainix</a>
      <a class="btn btn-line" href="https://shahredza.github.io/garaj/app03.html"><i style="background:var(--t3)" aria-hidden="true"></i>App 03</a>
    </div>
  </div>
</main>

<footer><div class="wrap">© 2026 Shah Redza · HealthyBite × Gainix</div></footer>

<script>
  (function () {
    var els = document.querySelectorAll("[data-en]");
    els.forEach(function (e) { e.dataset.ms = e.textContent; });
    function setLang(l) {
      els.forEach(function (e) { e.textContent = l === "en" ? e.dataset.en : e.dataset.ms; });
      document.documentElement.lang = l === "en" ? "en" : "ms";
      document.title = l === "en" ? "Off track · Shah Redza" : "Keluar trek · Shah Redza";
      document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
      try { localStorage.setItem("lang", l); } catch (e) {}
    }
    document.querySelectorAll(".lang button").forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });
    var saved = null; try { saved = localStorage.getItem("lang"); } catch (e) {}
    if (saved === "en") setLang("en");
  })();
</script>
</body>
</html>
